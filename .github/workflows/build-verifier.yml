name: Build verifier image

on:
  push:
    tags:
      - "vrf-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vrf-verifier
    steps:
      - name: Checkout (full history for verify-tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is signed
        run: |
          gpg --import release-key.asc
          # actions/checkout leaves a detached commit; the annotated tag object
          # isn't guaranteed locally, so verify-tag would see a commit and fail
          # with "cannot verify a non-tag object". Force-fetch the tag object.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git verify-tag "${GITHUB_REF_NAME}"

      - name: Compute sha256(vrf.py)
        id: hash
        run: |
          h=$(sha256sum vrf.py | cut -d' ' -f1)
          echo "vrf_sha256=${h}" >> "$GITHUB_OUTPUT"
          echo "sha256(vrf.py) = ${h}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: vrf/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            pumpling.vrf.sha256=${{ steps.hash.outputs.vrf_sha256 }}

      - name: Write release-notes draft
        run: |
          {
            echo "## Release artifacts"
            echo ""
            echo "- **Tag:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **sha256(vrf.py):** \`${{ steps.hash.outputs.vrf_sha256 }}\`"
            echo "- **Verifier image:** \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo "- **Image digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "### Reproduce"
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE}@${{ steps.build.outputs.digest }}"
            echo "docker run --rm ${IMAGE}@${{ steps.build.outputs.digest }} <ROUND_PUBKEY>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
